name: CI

# Everything here runs offline on the in memory sample workshop: no secrets and
# no Supabase project. The backend suites (supabase/tests and npm run e2e:live)
# need a live practice project and are run by hand.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: App end to end (Playwright, in memory source)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload the report and videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7

  powersync:
    name: Sync rules (PowerSync compiler, offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: powersync/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The PowerSync compiler uses `using` declarations, which need Node 24.
          node-version: 24
          cache: npm
          cache-dependency-path: powersync/tests/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The schema test rewrites generated-client-schema.ts.txt; it must match what is committed.
      - name: Generated client schema is up to date
        run: git diff --exit-code -- generated-client-schema.ts.txt
